name: rust

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: check formatting
        run: cargo fmt --check

      - name: run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: install GnuPG on macOS
        if: runner.os == 'macOS'
        run: brew install gnupg

      - name: use Git for Windows GnuPG
        if: runner.os == 'Windows'
        run: |
          $gpg = Join-Path $env:ProgramFiles 'Git\usr\bin\gpg.exe'
          if (!(Test-Path $gpg)) { throw "GnuPG not found at $gpg" }
          Split-Path $gpg | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $gpg --version

      - name: run tests
        run: cargo test
